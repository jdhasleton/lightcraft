[package]
name = "lightcraft-denoise"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft AI denoise (L1): denoise-model manifests, Bayer packing, tiling and blending, the cache file, and pure-Rust CPU inference"

[lints]
workspace = true

[features]
default = []
runtime = ["dep:faer"]
# The candle runner (`src/candle.rs`): networks LightCraft has written in candle, with safetensors weights, on the
# graphics card (Metal on macOS) or the processor. It shares the installation self-test of `runtime`.
candle = ["runtime", "dep:candle-core", "dep:lightcraft-denoise-pmrid"]
# candle networks on NVIDIA cards (CUDA): for the training tool only, never the app (CUDA C kernels; see the PMRID crate)
cuda = ["candle", "candle-core/cuda", "lightcraft-denoise-pmrid/cuda"]
# Product-policy switch: absent by default; users may install their own model.
rawnind-model = ["lightcraft-denoise-core/rawnind-model"]

[dependencies]
lightcraft-denoise-core = { workspace = true }
# Safe matrix views over the pure-Rust GEMM backend; no BLAS, cc/build scripts
# or inner thread pool. Its dependencies include architecture-specific assembly.
faer = { package = "faer-core", version = "=0.17.1", default-features = false, features = ["std"], optional = true }
lightcraft-raster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
miniz_oxide = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }

# the candle runner is native only (the web build has no AI denoise models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Pure Rust (default features off: no MKL, Accelerate or CUDA); the version SAM 3 uses (see the workspace manifest).
candle-core = { workspace = true, optional = true }
# PMRID's network: Apache-2.0 only (its definition follows the authors' PyTorch code; see NOTICE)
lightcraft-denoise-pmrid = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, optional = true, features = ["metal"] }

[[example]]
name = "pmrid-convert"
required-features = ["candle"]

[dev-dependencies]
proptest = { workspace = true }
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
